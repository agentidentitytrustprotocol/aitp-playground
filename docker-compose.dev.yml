services:
  playground:
    build:
      context: ..
      dockerfile: aitp-playground/Dockerfile
      args:
        # The published PyPI wheels lack the experimental features
        # (renewal, session bundles, multihop) from aitp-sdk 0.24; compile
        # the locked sdist with them, like the hosted image (D-26).
        AITP_SDK_SOURCE: pypi-src
        AITP_SDK_FEATURES: experimental
    command: ["uvicorn", "aitp_playground.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./src:/app/src
      - ./agents:/app/agents
      - ./scenarios:/app/scenarios
    environment:
      - LOG_LEVEL=DEBUG
