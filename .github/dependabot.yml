version: 2
updates:
  # Keep GitHub Actions pinned versions fresh (checkout, setup-uv, buildx, ...).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  # Python deps are resolved through uv.lock; Dependabot's uv support tracks
  # pyproject.toml + uv.lock together.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    groups:
      # aitp-sdk is normally adopted the moment aitp-rs publishes, via the
      # event-driven bump-aitp workflow. This group is the backstop: if a
      # dispatch is ever missed, Dependabot opens the same bump PR weekly.
      aitp-sdk:
        patterns:
          - aitp-sdk
      # Everything else: one PR for minor+patch, majors held separately.
      minor-and-patch:
        update-types:
          - minor
          - patch
      major-updates:
        update-types:
          - major
