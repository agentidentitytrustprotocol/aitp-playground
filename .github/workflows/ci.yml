name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: ruff check
        run: uv run --only-group dev ruff check src agents tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Floor (requires-python) and latest.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies from lockfile
        # aitp-sdk ships manylinux wheels on PyPI, so the full suite —
        # including the SDK-dependent tests — runs here. No local Rust
        # toolchain or maturin build needed.
        run: uv sync --locked

      - name: Run unit + scenario tests with coverage
        run: |
          uv run coverage run -m pytest tests/unit tests/scenarios -q
          uv run coverage report --fail-under=88

  integration:
    name: Integration (agent subprocess e2e)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies from lockfile
        run: uv sync --locked

      - name: Run gated runner integration tests
        # Spawns real agent subprocesses (deterministic stubs, no LLM keys)
        # and drives a full scenario run through the API.
        run: AITP_E2E=1 uv run pytest tests/integration/test_runner.py -v
        timeout-minutes: 10
