name: CI

# No `push: main` trigger (DECISIONS.md D-29). Branch protection is strict, so
# the tree a PR run tests is the tree that merges; a push run re-tested it.
# The weekly schedule keeps the two signals a push run gave beyond PRs: a
# direct admin push, and upstream drift of aitp-verifier-py that the JCS
# drift guard below clones at HEAD.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

concurrency:
  # Superseded PR runs are cancelled. Other runs are never cancelled once running;
  # a newer run still replaces a pending one in the same group.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # WARNING: every job `name:` in this file (and docker.yml's `e2e` job) is a
  # literal string in main's required status checks — GitHub has no other
  # handle for a required check. Renaming a job here (or the matrix values
  # below, which become part of the "Tests (Python X.Y)" name) makes the
  # required context stop reporting; the PR making the change blocks itself,
  # not fails loudly. Land a `required_status_checks` update in the SAME PR
  # as any such rename. See DECISIONS.md D-13.
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: ruff check
        run: uv run --only-group dev ruff check src agents tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Floor (requires-python) and latest.
        # WARNING: these values become the required-check context NAMES via
        # `name: Tests (Python ${{ matrix.python-version }})` above. main's
        # branch protection requires "Tests (Python 3.11)" and
        # "Tests (Python 3.13)" literally. Changing this list renames the
        # contexts, the required checks never report, and the PR making the
        # change blocks itself with no skip fallback (unlike docker.yml's
        # `e2e` job, which always reports skipped-or-real). Land the
        # required_status_checks update in the SAME PR. See DECISIONS.md D-13.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies from lockfile
        # aitp-sdk ships manylinux wheels on PyPI, so the full suite —
        # including the SDK-dependent tests — runs here. No local Rust
        # toolchain or maturin build needed.
        run: uv sync --locked

      - name: Check out the independent verifier (drift source)
        # `tests/unit/_jcs_reference.py` is a verbatim copy of
        # aitp-verifier-py's canonicalizer, vendored because that package is
        # not on PyPI and a path dependency would make this suite depend on a
        # checkout CI does not have. Its independence from aitp-sdk is the
        # whole point: a JCS check that runs against the SDK it is checking is
        # self-consistent, which is exactly what let the 0.5.0 signing-input
        # divergence survive a release.
        #
        # The drift guard compares the copy to its source and SKIPS when the
        # source is absent — so without this step it was a permanent no-op in
        # CI, catching drift only on a developer machine that happened to have
        # both checkouts. Cloning here makes it a real gate, and against
        # verifier HEAD rather than some released version, which is stricter
        # than the dev-dependency this vendoring stands in for.
        #
        # Plain `git clone` rather than actions/checkout: the parent of
        # $GITHUB_WORKSPACE is writable, but actions/checkout refuses paths
        # outside the workspace. Public repo, so no token needed. A clone
        # failure is a loud error, not a silent skip.
        run: |
          git clone --depth 1 \
            https://github.com/agentidentitytrustprotocol/aitp-verifier-py \
            "$(dirname "$GITHUB_WORKSPACE")/aitp-verifier-py"

      - name: Run unit + scenario tests with coverage
        run: |
          uv run coverage run -m pytest tests/unit tests/scenarios -q
          # Two gates over one measurement, not one aggregate: a single
          # combined number would let a regression in src/ hide behind
          # agents/base's lower floor (or vice versa). See DECISIONS.md D-17.
          uv run coverage report --include="src/*" --fail-under=88
          uv run coverage report --include="agents/base/*" --fail-under=54

  test-experimental:
    # Not a required check yet (D-13): it compiles aitp-sdk from source.
    name: Tests (experimental SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # setup-uv prunes with `uv cache prune --ci`, which keeps wheels
          # built from source, so the compiled SDK is reused until uv.lock
          # changes. That replaces a Rust cache. The suffix keeps this cache
          # apart from the plain 3.13 Tests job, which has the same lock
          # hash and would otherwise save a cache without the compiled SDK.
          enable-cache: true
          cache-suffix: experimental
          python-version: "3.13"

      - name: Install dependencies, compiling aitp-sdk with `experimental`
        # The PyPI wheels lack the experimental features from aitp-sdk 0.24
        # (D-26), so build the locked sdist. A config setting, not
        # MATURIN_PEP517_ARGS, carries the features: config settings are part
        # of uv's build-cache key, so a cached featureless build can't win.
        run: |
          uv sync --locked --all-extras --no-binary-package aitp-sdk \
            --config-settings-package 'aitp-sdk:build-args=--features experimental'
          uv run --no-sync python -c "import aitp; assert hasattr(aitp, 'SessionBundleBuilder') and hasattr(aitp.AitpAgent, 'build_renewal_request') and hasattr(aitp, 'verify_delegation_multihop'), 'aitp-sdk built without experimental'"

      - name: Check out the independent verifier (drift source)
        # Same as the Tests job: the JCS drift guard fails under CI without it.
        run: |
          git clone --depth 1 \
            https://github.com/agentidentitytrustprotocol/aitp-verifier-py \
            "$(dirname "$GITHUB_WORKSPACE")/aitp-verifier-py"

      - name: Run unit + scenario tests, failing on any missing feature
        # `--no-sync` keeps `uv run` from re-syncing the PyPI wheel over the
        # source build. AITP_EXPECT_EXPERIMENTAL=1 turns every
        # @requires_sdk_feature skip into a failure.
        run: AITP_EXPECT_EXPERIMENTAL=1 uv run --no-sync pytest tests/unit tests/scenarios -q

  integration:
    name: Integration (agent subprocess e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      # Scratch database for tests/integration/test_quota_postgres.py (the
      # LLM quota store on a real Postgres, same major as Railway's).
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: quota
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d quota"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      PLAYGROUND_TEST_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/quota
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies from lockfile
        run: uv sync --locked

      - name: Check out the independent verifier (drift source)
        # test_stable_only_sdk.py re-runs tests/unit, whose JCS drift guard
        # fails under CI without this checkout (see the Tests job's step).
        run: |
          git clone --depth 1 \
            https://github.com/agentidentitytrustprotocol/aitp-verifier-py \
            "$(dirname "$GITHUB_WORKSPACE")/aitp-verifier-py"

      - name: Run gated runner integration tests
        # Spawns real agent subprocesses (deterministic stubs, no LLM keys)
        # and drives a full scenario run through the API.
        # test_federated_handshake.py needs no Docker stack — it drives an
        # in-process TestClient over two real loopback ports — and until
        # this line it ran nowhere in CI: the only coverage of the
        # cross-origin handshake path and the loopback fail-closed guard.
        # test_stable_only_sdk.py re-runs tests/unit as if aitp-sdk were a
        # stable-only (no `experimental`) wheel (#117).
        # test_quota_postgres.py runs on the postgres service above.
        # test_lockdown_socket_e2e.py: the backend lockdown flag on, over a
        # real uvicorn socket (no agents, no LLM key).
        run: AITP_E2E=1 uv run pytest tests/integration/test_runner.py tests/integration/test_federated_handshake.py tests/integration/test_revocation_two_agents.py tests/integration/test_stable_only_sdk.py tests/integration/test_quota_postgres.py tests/integration/test_lockdown_socket_e2e.py -v
        timeout-minutes: 10

      - name: Run LLM quota end-to-end test
        # Needs the researcher and writer extras so both agents' real LLM
        # paths exist; the provider is a closed loopback port and the key is
        # fake, so no network call leaves the runner. Runs last: the extras
        # stay out of the stable-only SDK run above.
        run: AITP_E2E=1 CP_BASE_URL='' uv run --locked --extra researcher --extra writer pytest tests/integration/test_llm_quota_e2e.py -v
        timeout-minutes: 5
