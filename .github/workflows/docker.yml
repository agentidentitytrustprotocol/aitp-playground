name: Docker

# Builds the playground container and (on main) runs the full docker-compose
# e2e stack — postgres + control plane + playground + tests.
#
# Layout note: the Dockerfile expects build context = parent directory so the
# sibling repos are visible. We reproduce that layout in the runner by
# checking out each repo into its own sibling path under $GITHUB_WORKSPACE,
# then running docker commands from the workspace root.
#
#   $GITHUB_WORKSPACE/
#     aitp-playground/   ← this repo
#     aitp-cp/           ← sibling, needed by Dockerfile.cp-e2e (e2e job only)
#     aitp-rs/           ← sibling, needed by Dockerfile.cp-e2e (e2e job only)
#
# Note which image needs which sibling — they are NOT the same dependency:
#
#   * The PLAYGROUND image no longer needs aitp-rs at all. It defaults to
#     AITP_SDK_SOURCE=pypi and installs aitp-sdk at the version uv.lock pins,
#     so both the published image and the e2e stack run the SDK this repo
#     actually depends on. Previously every job checked aitp-rs out at
#     unpinned `main` and compiled it, which meant the published image
#     embedded an unreleased SDK and no test here could observe a
#     pin/behaviour mismatch. Hence `build-and-push` checks out only this
#     repo. Pass `--build-arg AITP_SDK_SOURCE=path` (with aitp-rs checked
#     out) only when you specifically mean to test unreleased SDK source.
#
#   * The CONTROL PLANE image still does. Dockerfile.cp-e2e compiles the CP's
#     own napi binding from aitp-rs source, because the sibling CP repo checks
#     in only a darwin-arm64 .node. That is why the e2e job keeps the
#     checkout even though the playground image stopped needing it.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

concurrency:
  # Cancel superseded runs on the same ref to keep the queue tidy.
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }} # agentidentitytrustprotocol/aitp-playground

jobs:
  build-and-push:
    name: Build & push playground image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout aitp-playground
        uses: actions/checkout@v7
        with:
          path: aitp-playground

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        # Only push on main + tags. PRs build to validate the Dockerfile but
        # skip auth + push.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (and push on main / tags)
        uses: docker/build-push-action@v7
        with:
          # Context is the workspace root — the layout the Dockerfile was
          # written against. On the default AITP_SDK_SOURCE=pypi path the only
          # thing read from it is aitp-playground/ itself.
          context: .
          file: ./aitp-playground/Dockerfile
          # Bake the agent LLM extras (crewai + langchain + langgraph + LLM
          # clients) into the published image so the deployed playground can
          # call a real provider when LLM_PROVIDER / *_API_KEY are set at
          # runtime. Without this the image ships no LLM libs and every worker
          # silently falls back to its deterministic stub.
          build-args: |
            INSTALL_EXTRAS=all-agents
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # linux/amd64 only for now. The SDK stage compiles a Rust extension
          # via maturin; cross-building to arm64 under QEMU adds ~10 min per
          # build. Add linux/arm64 here once that cost is worth paying.
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  changes:
    name: Detect SDK pin changes
    # Cheap (~10s) gate for the expensive e2e job below. Runs on every event
    # so the `e2e` job has a definite input rather than a skipped dependency.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sdk_pin: ${{ steps.filter.outputs.sdk_pin }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            sdk_pin:
              # `uv.lock` alone, deliberately — NOT pyproject.toml as well.
              #
              # Sufficient: uv mirrors the *declared specifier string* into
              # `[package.metadata].requires-dist`, so any edit to a dependency
              # in pyproject.toml makes the lock stale and forces a regen. A
              # floor change without a uv.lock change is not representable.
              # (Learned the hard way in Phase 1 of this work: an acceptance
              # criterion asserting "no uv.lock modification" while changing the
              # specifier turned out to be unsatisfiable for exactly this
              # reason.)
              #
              # And tighter: pyproject.toml also holds [tool.ruff],
              # [tool.pytest.ini_options] and the LLM extras, which change for
              # reasons that have nothing to do with the SDK pin. Including it
              # would fire this ~6-minute two-sibling-checkout job on routine
              # dependency and tooling bumps — the cost regression criterion 2
              # exists to prevent.
              - 'uv.lock'

  e2e:
    # WARNING: this exact string is one of main's required status check
    # contexts (`required_status_checks`, DECISIONS.md D-13). Renaming this
    # job, or restructuring the workflow so a job with this exact name no
    # longer reports, makes the required context stop reporting — the PR
    # making the change blocks itself rather than failing loudly. Land a
    # `required_status_checks` update in the SAME PR as any such rename.
    name: docker-compose e2e
    needs: changes
    # Two triggers, for two different questions:
    #
    #   * every push to main — the standing regression check.
    #   * any PR that moves the SDK pin — the cross-implementation check,
    #     BEFORE it merges.
    #
    # The second one is the point. `auto-merge.yml` runs on `pull_request` and
    # delegates to aitp-ci's shared auto-merge, so a green bump PR merges
    # unattended. Post-merge e2e *detects* a signer/verifier disagreement;
    # pre-merge e2e *prevents* it — and with auto-merge armed, detection lands
    # after the change is already on main. The only reason the issuer half of
    # the 0.5.0 flip did not roll unnoticed is that the control plane happened
    # to have a red integration test.
    #
    # Deliberately NOT widened to all PRs: the stack is ~6 minutes and pulls
    # two sibling repos. Scope it to the pin, and note that a paths-filter
    # also catches a hand-edited pin, which a branch-name match on the bump
    # bot's convention would not.
    #
    # If this job goes red because the control-plane half of a coordinated
    # flip has not shipped yet, that is the design working — sequence the
    # rollout, do not disable the job.
    #
    # `always()` so a failure in the cheap `changes` job cannot starve the
    # push-to-main run. Without it, `needs: changes` silently converts any
    # transient failure of the filter step into "e2e did not run on main" —
    # a new way for the standing regression check to go quiet, introduced by
    # the job that was supposed to make it fire *more* often.
    if: >-
      always() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'pull_request' && needs.changes.outputs.sdk_pin == 'true')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout aitp-playground
        uses: actions/checkout@v7
        with:
          path: aitp-playground

      - name: Checkout sibling aitp-rs (needed by Dockerfile.cp-e2e)
        # NOT for the playground image — that installs the pinned wheel from
        # PyPI now (AITP_SDK_SOURCE=pypi). This is for the *control plane*:
        # Dockerfile.cp-e2e:46-48 compiles the CP's own napi binding from
        # aitp-rs source, because the sibling CP repo checks in only a
        # darwin-arm64 .node. Removing this checkout breaks the aitp-cp image,
        # not the playground one.
        uses: actions/checkout@v7
        with:
          repository: agentidentitytrustprotocol/aitp-rs
          path: aitp-rs

      - name: Checkout sibling aitp-control-plane (as aitp-cp)
        # docker-compose.test.yml + Dockerfile.cp-e2e reference the CP repo
        # under the path "aitp-cp" (its historical short name). The repo on
        # GitHub is "aitp-control-plane", so we check it out and rename via
        # the `path` input.
        uses: actions/checkout@v7
        with:
          repository: agentidentitytrustprotocol/aitp-control-plane
          path: aitp-cp

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Materialize .env for compose
        # docker-compose.test.yml reads aitp-playground/.env for OPENAI_API_KEY
        # and a couple of provider knobs. Without the key the LLM tests
        # self-skip (see tests/integration/test_llm_e2e.py:95); the protocol
        # e2e tests run either way.
        working-directory: aitp-playground
        run: |
          cp .env.example .env
          if [ -n "${{ secrets.OPENAI_API_KEY }}" ]; then
            printf '\nOPENAI_API_KEY=%s\n' '${{ secrets.OPENAI_API_KEY }}' >> .env
          else
            echo "::warning::OPENAI_API_KEY secret not set — LLM e2e assertions will be skipped (protocol e2e still runs)."
          fi

      - name: Bring up the stack and run tests
        working-directory: aitp-playground
        run: |
          docker compose -f docker-compose.test.yml up \
            --build \
            --abort-on-container-exit \
            --exit-code-from tests

      - name: Dump container logs on failure
        if: failure()
        working-directory: aitp-playground
        run: docker compose -f docker-compose.test.yml logs --no-color --tail=500

      - name: Tear down
        if: always()
        working-directory: aitp-playground
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans
