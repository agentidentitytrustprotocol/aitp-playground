[project]
name = "aitp-playground"
version = "0.1.0"
description = "AITP scenario demonstration service"
requires-python = ">=3.11"
dependencies = [
  # The AITP SDK, distribution name "aitp-sdk", import name "aitp".
  # NOTE: depend on "aitp-sdk", NOT "aitp" — the latter is an unrelated
  # placeholder package on PyPI that pip would otherwise pull in (the SDK was
  # renamed aitp -> aitp-sdk).
  # It is the Rust-backed wheel compiled from the sibling
  # ../aitp-rs/bindings/aitp-py via `maturin develop` (native) or built into
  # the Docker image (and also published to PyPI as aitp-sdk). For full
  # scenario coverage, build the wheel with experimental features
  # (`maturin ... --features experimental`); the service detects what's
  # available at runtime via GET /capabilities.
  # Floor pinned to 0.3.0 = the compact-JWS SDK (protocol `aitp/0.2`); the
  # pre-0.3 (JCS, protocol `aitp/0.1`) wheels are wire-incompatible. To
  # develop against unreleased SDK source instead of the PyPI wheel, add a
  # `[tool.uv.sources]` path override (requires a local Rust toolchain):
  #   [tool.uv.sources]
  #   aitp-sdk = { path = "../aitp-rs/bindings/aitp-py" }
  "aitp-sdk>=0.4.0",
  "fastapi>=0.139.0",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.7",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "httpx>=0.27",
  "anyio>=4.7",
  # Ed25519 keys + serialization, used directly by the trust/OIDC layer
  # (src/aitp_playground/trust/oidc_issuer.py) and the agent base
  # (agents/base/oidc.py). Must be a BASE dependency: the runtime image
  # installs `pip install -e .` with no extras, and cryptography would
  # otherwise only arrive transitively via the optional *-agents extras,
  # so agents crash with ModuleNotFoundError when those aren't installed.
  "cryptography>=42",
]

[project.optional-dependencies]
researcher = ["crewai>=0.70", "langchain-openai>=0.2", "langchain-anthropic>=0.3", "openai>=1.50"]
writer = ["langchain>=0.3", "langchain-openai>=0.2", "langchain-anthropic>=0.3", "openai>=1.50"]
analyzer = ["langgraph>=0.2", "langchain-openai>=0.2", "langchain-anthropic>=0.3", "openai>=1.50"]
all-agents = [
  "crewai>=0.70",
  "langgraph>=0.2",
  "langchain>=0.3",
  "langchain-openai>=0.2",
  "langchain-anthropic>=0.3",
  "openai>=1.50",
]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "coverage[toml]>=7.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aitp_playground"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "agents/base"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=0.24",
  "coverage[toml]>=7.6",
  "ruff>=0.8",
]

[tool.ruff]
src = ["src", "agents/base", "tests"]

[tool.ruff.lint]
# Default pyflakes/pycodestyle-error rules only; formatting is not enforced.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests import after pytest.importorskip (E402) and use throwaway lambdas (E731).
"tests/**" = ["E402", "E731"]

[tool.coverage.run]
source_pkgs = ["aitp_playground"]

[tool.coverage.report]
precision = 1
