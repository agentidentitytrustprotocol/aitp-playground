[project]
name = "aitp-playground"
version = "0.1.0"
description = "AITP scenario demonstration service"
requires-python = ">=3.11"
dependencies = [
  # The AITP SDK, distribution name "aitp-sdk", import name "aitp".
  # NOTE: depend on "aitp-sdk", NOT "aitp" — the latter is an unrelated
  # placeholder package on PyPI that pip would otherwise pull in (the SDK was
  # renamed aitp -> aitp-sdk).
  # It is the Rust-backed wheel from the sibling ../aitp-rs/bindings/aitp-py,
  # published to PyPI as aitp-sdk and installed from there by default (the
  # Docker image does the same; AITP_SDK_SOURCE=path compiles the sibling
  # source instead). The optional capabilities (renewal, session bundles,
  # SPKI pinning, multi-hop delegation) are default-on cargo features of the
  # published wheel; the service detects what's available at runtime via
  # GET /capabilities.
  # The floor records wire compatibility, not "the newest we happened to test".
  # These breaking changes, and one routine adoption, are behind it:
  #   0.3.0 — the compact-JWS SDK (protocol `aitp/0.2`). The pre-0.3 wheels
  #     (JCS, protocol `aitp/0.1`) are wire-incompatible.
  #   0.5.0 — the JCS signing input moved from the transport wrapper to the
  #     inner artifact body for revocation snapshots and session trust
  #     bundles. A snapshot signed by <=0.4.x does not verify under >=0.5.0
  #     and vice versa; aitp-rs implements no dual-accept, so there is no
  #     version that reads both. Resolving 0.4.x here would not fail loudly —
  #     it would fail as a signature mismatch that reads like a network
  #     problem. The floor is what turns that into a resolver error.
  #   0.6.0 — `verify_revocation_list` exists. Not a wire change: this is the
  #     first wheel that can VERIFY a revocation snapshot at all, which the
  #     agents now require. On an older wheel every snapshot is discarded
  #     (cause=sdk_cannot_verify) and a CP-pinned agent runs degraded, so the
  #     floor is what makes that a resolver error rather than a runtime one.
  #   0.7.0 — two verify calls gained a required argument, not a wire change:
  #     `verify_manifest_json` failures carry a typed `.code` (agent_admin.py
  #     classifies it; a missing code on an older wheel reports every failure
  #     as `unknown`), and `verify_delegation`/`verify_delegation_multihop`
  #     take a deny-set parameter (the delegation redeem handler in
  #     aitp_server.py; an older wheel raised TypeError, turned into a 503
  #     rather than a silent downgrade, until 0.16 made the floor moot).
  #   0.11.0 — the pinned-key identity proof's timestamp encoding changed from
  #     an 8-byte big-endian integer to base-10 ASCII decimal (RFC-AITP-0002
  #     §3.1 erratum, spec issue #17). A HELLO/HELLO_ACK pinned-key proof
  #     minted by <=0.10.x does not verify under >=0.11.0 and vice versa;
  #     aitp-rs implements no dual-accept. This repo's DEFAULT identity_type is
  #     "pinned_key" (the default in agents/base/bootstrap.py and the registry's
  #     identity model), so this is the
  #     handshake path, not an edge case — and <=0.10.x never interoperated
  #     with aitp-verifier-py on it at all, which has always used the
  #     ASCII-decimal form. A mixed-version pair fails as handshake.failed with
  #     a signature error, which reads like a bad key. The floor is what turns
  #     that into a resolver error.
  #   0.12.0 — NOT wire-breaking, adopted here as routine floor tracking, not
  #     because an older wheel misbehaves. Adds three ErrorCode variants
  #     (MANIFEST_INVALID, REVOCATION_SNAPSHOT_INVALID,
  #     REVOCATION_SNAPSHOT_SIGNATURE_INVALID) consumed only by
  #     aitp-transport-http/aitp-rs-adapter, and IdentityDescriptor.extensions
  #     on the wire — neither reaches this repo: `.code` handling here
  #     (agent_admin.py, engine.py, revocation_refresh.py) reads the
  #     Python binding's own separate, generic `getattr(exc, "code", None)`
  #     taxonomy, not aitp-core's ErrorCode; and IdentityDescriptor is read as
  #     a plain untyped dict (engine.py), never a typed pyclass, so an
  #     unrecognized wire field just passes through invisibly.
  #   0.14.0 — a pinned_key peer is admitted only if its AID is in the
  #     session's trust store (`pinned_keys=`; empty rejects every peer), and
  #     every UUID on the wire (jti, message_id, session_id) must be v4. The
  #     runner pushes each launched agent's AID to its peers
  #     (/admin/trust-peers); hosted agents take a did:web-verified one
  #     (/hosted-agents/{id}/trust-peer). See DECISIONS.md D-22.
  #   0.15.0 / 0.16.0 — keys come from verified Manifests, never from the
  #     artifact: `verify_delegation` needs the issuer Manifests and
  #     `verify_session_bundle` the coordinator Manifest. The engine carries
  #     their URLs and the agents fetch and verify them. The 0.7.0 TypeError
  #     503 is gone. Manifest members outside the schema fail `unknown_field`.
  #   0.17.0 — protocol `aitp/0.3`, a strict cutover with no dual-accept:
  #     envelope signing input v2 (version, message_type and extensions are
  #     now signed), and every Manifest, TCT, delegation, snapshot and bundle
  #     says `aitp/0.3`. An aitp/0.2 peer or control plane fails verification,
  #     so the control plane must be on aitp >= 0.17 too. The upper bound
  #     keeps the next wire cutover a deliberate bump.
  #   0.18.0 — no wire change (still `aitp/0.3`; 0.17 peers interoperate).
  #     Revocation signing and snapshot parsing refuse an `entries[].jti`
  #     that is not a lowercase UUID v4 (0.17 signed one no verifier would
  #     accept), and an unknown snapshot version maps to the spec's
  #     REVOCATION_SNAPSHOT_INVALID — the Python cause stays
  #     `version_unknown`. The floor moves with the bounded range, not for
  #     a wire break: the `<0.18` upper bound made this a deliberate bump.
  #   0.19.0 — no wire change (still `aitp/0.3`; 0.18 peers interoperate).
  #     The bindings sign only a lowercase UUID v4 `message_id`/`session_id`
  #     (the playground passes `str(uuid.uuid4())` and never sets a
  #     message_id), and a non-UUID `revoked_jtis` entry now raises instead
  #     of being ignored — so `/admin/revoke-tct` refuses one with 400 and
  #     stores the canonical form. Also fixes the Python binding never
  #     matching an uppercase or braced deny-list entry. The floor moves
  #     with the bounded range: the `<0.19` upper bound made this deliberate.
  #   0.20.0 — revocation is fail_closed: `verify_tct(_cached)`,
  #     `verify_delegation(_multihop)`, `process_commit` and `complete` reject
  #     every TCT when no `revoked_jtis` is supplied, so each call site passes
  #     the agent's effective deny-set and `revocation="fail_closed"`
  #     explicitly. `build_manifest` takes `revocation_list_uri` (advertised
  #     as `rfc-aitp-0008.revocation_list_uri`) and `REVOCATION_LIST_PATH` is
  #     exported. Still `aitp/0.3`; the floor moves with the `<0.20` bound.
  #   Upgrade guides: ../aitp-rs/docs/upgrading-0.14.md to upgrading-0.19.md;
  #   0.20 is in ../aitp-rs/CHANGELOG.md.
  # To develop against unreleased SDK source instead of the PyPI wheel, add a
  # `[tool.uv.sources]` path override (requires a local Rust toolchain):
  #   [tool.uv.sources]
  #   aitp-sdk = { path = "../aitp-rs/bindings/aitp-py" }
  "aitp-sdk>=0.20.0,<0.21",
  "fastapi>=0.140.13",
  "uvicorn[standard]>=0.51.0",
  "pydantic>=2.10",
  "pydantic-settings>=2.14.2",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "httpx>=0.27",
  "anyio>=4.14.2",
  # Ed25519 keys + serialization, used directly by the trust/OIDC layer
  # (src/aitp_playground/trust/oidc_issuer.py) and the agent base
  # (agents/base/oidc.py). Must be a BASE dependency: the runtime image
  # installs `pip install -e .` with no extras, and cryptography would
  # otherwise only arrive transitively via the optional *-agents extras,
  # so agents crash with ModuleNotFoundError when those aren't installed.
  "cryptography>=49.0.0",
]

[project.optional-dependencies]
researcher = ["crewai>=1.15.2", "langchain-openai>=1.4.1", "langchain-anthropic>=1.5.3", "openai>=2.50.0"]
writer = ["langchain>=1.3.14", "langchain-openai>=1.4.1", "langchain-anthropic>=1.5.3", "openai>=2.50.0"]
analyzer = ["langgraph>=1.2.10", "langchain-openai>=1.4.1", "langchain-anthropic>=1.5.3", "openai>=2.50.0"]
all-agents = [
  "crewai>=1.15.2",
  "langgraph>=1.2.10",
  "langchain>=1.3.14",
  "langchain-openai>=1.4.1",
  "langchain-anthropic>=1.5.3",
  "openai>=2.50.0",
]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "coverage[toml]>=7.15.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aitp_playground"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "agents/base"]

[dependency-groups]
dev = [
  "pytest>=9.1.1",
  "pytest-asyncio>=0.24",
  "coverage[toml]>=7.15.2",
  "ruff>=0.16.0",
]

[tool.ruff]
src = ["src", "agents/base", "tests"]

[tool.ruff.lint]
# Default pyflakes/pycodestyle-error rules only; formatting is not enforced.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Tests import after pytest.importorskip (E402) and use throwaway lambdas (E731).
"tests/**" = ["E402", "E731"]

[tool.coverage.run]
source_pkgs = ["aitp_playground"]
# `agents/base` holds every revocation/manifest/TCT/delegation security
# decision in the repo and has no `agents/__init__.py` (so it is not an
# importable package `source_pkgs` can name) — measured via `source` instead,
# alongside `aitp_playground`. Two separate `coverage report --include` gates
# in ci.yml, not one aggregate: see DECISIONS.md D-17.
source = ["agents/base"]

[tool.coverage.report]
precision = 1
