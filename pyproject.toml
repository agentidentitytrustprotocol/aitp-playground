[project]
name = "aitp-playground"
version = "0.1.0"
description = "AITP scenario demonstration service"
requires-python = ">=3.11"
dependencies = [
  "aitp",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "pyyaml>=6.0",
  "jsonschema>=4.23",
  "httpx>=0.27",
  "anyio>=4.7",
]

[project.optional-dependencies]
researcher = ["crewai>=0.70", "langchain-anthropic>=0.3"]
writer = ["langchain>=0.3", "langchain-anthropic>=0.3"]
analyzer = ["langgraph>=0.2", "langchain-anthropic>=0.3"]
all-agents = ["crewai>=0.70", "langgraph>=0.2", "langchain>=0.3", "langchain-anthropic>=0.3"]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "coverage[toml]>=7.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aitp_playground"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src", "agents/base"]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "coverage[toml]>=7.6",
]
