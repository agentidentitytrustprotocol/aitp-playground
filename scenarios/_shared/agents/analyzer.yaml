apiVersion: aitp.dev/v1
kind: AgentManifest
metadata:
  id: analyzer
  name: Data Analyzer
  framework: langgraph
  version: 1.0.0
spec:
  entrypoint:
    type: python_module
    value: analyzer.main
  host:
    python: python3            # falls back to AGENT_PYTHON; absolute paths that don't exist (e.g. in Docker) fall back too
    cwd: agents/analyzer
    startupTimeoutMs: 30000
  aitp:
    offered_caps: [analyze.data]
    display_name: Data Analyzer
    identity_type: pinned_key
    ttl_secs: 3600
  did_web: false
