apiVersion: aitp.dev/v1
kind: AgentManifest
metadata:
  id: writer
  name: Content Writer
  framework: langchain
  version: 1.0.0
spec:
  entrypoint:
    type: python_module
    value: writer.main
  host:
    python: python3            # falls back to AGENT_PYTHON; absolute paths that don't exist (e.g. in Docker) fall back too
    cwd: agents/writer
    startupTimeoutMs: 30000
  aitp:
    offered_caps: [write.content]
    display_name: Content Writer
    identity_type: pinned_key
    ttl_secs: 3600
  did_web: false
