apiVersion: aitp.dev/v1
kind: ScenarioVersion
metadata:
  pack: intra-org
  scenario: research-and-write
  version: 1.0.0
  name: Research and Write
  summary: >
    CrewAI researcher gathers facts, LangChain writer produces an article.
    Both agents are in the same trust domain — trust anchors are pre-shared.
  tags: [research, writing, crewai, langchain]

spec:
  inputs:
    schema:
      type: object
      properties:
        topic:
          type: string
          default: "AI agent collaboration"
        style:
          type: string
          enum: [academic, casual, technical]
          default: casual
      required: [topic]

  agents:
    - id: researcher
      ref: _shared/agents/researcher
      port_offset: 0
    - id: writer
      ref: _shared/agents/writer
      port_offset: 1

  trust:
    boundary: intra_org
    discovery: static

  workflow:
    steps:
      - id: trust
        description: All agents perform AITP mutual handshake
      - id: research
        agent: researcher
        capability: research.query
        input_template: "{{ inputs.topic }}"
      - id: write
        agent: writer
        capability: write.content
        input_from: research
