apiVersion: aitp.dev/v1
kind: ScenarioVersion
metadata:
  pack: intra-org
  scenario: cp-trust-anchor-provisioning
  version: 1.0.0
  name: CP Trust-Anchor Provisioning
  summary: >
    Pushes trust configuration to the Control Plane. The writer's pinned
    Ed25519 key (read from its published manifest) is registered via
    POST /api/pinned-keys and an OIDC issuer is registered via
    POST /api/trust-anchors, both scoped to the intra-org namespace. The step
    then reads both registries back to confirm the registration landed.
    Afterwards the researcher and writer handshake and exchange work as usual,
    showing trust still flows once the CP holds the configuration.

    When no Control Plane is configured (CP_BASE_URL unset) the provisioning
    step skips cleanly and the rest of the scenario still runs.
  tags: [control-plane, trust-anchors, pinned-keys, rfc-0002, rfc-0007]

spec:
  inputs:
    schema:
      type: object
      properties:
        topic:
          type: string
          default: "trust anchor provisioning"
      required: []

  agents:
    - id: researcher
      ref: _shared/agents/researcher
      port_offset: 0
    - id: writer
      ref: _shared/agents/writer
      port_offset: 1

  trust:
    boundary: intra_org
    discovery: static

  workflow:
    steps:
      - id: provision
        type: cp_provision_trust_anchor
        agent: writer
        namespace: intra-org
        issuer_url: "https://issuer.demo.local"
        description: >
          Register the writer's pinned key + an OIDC trust anchor with the
          Control Plane, then read both registries back to confirm.
      - id: trust
        description: researcher and writer perform AITP mutual handshake
      - id: write
        agent: researcher
        capability: write.content
        input_template: "Write about {{ inputs.topic }}"
        description: researcher invokes the writer using the established trust
