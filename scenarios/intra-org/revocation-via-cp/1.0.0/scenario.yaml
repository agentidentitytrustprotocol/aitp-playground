apiVersion: agentidentitytrustprotocol.io/playground/v1
kind: ScenarioVersion
metadata:
  pack: intra-org
  scenario: revocation-via-cp
  version: 1.0.0
  name: Revocation via Control Plane (RFC-AITP-0008)
  summary: >
    Revocation propagation through the Control Plane.
    Researcher establishes trust with writer; writer issues a TCT and the
    researcher's first call succeeds. Researcher then revokes the writer's
    TCT and the engine *also* posts the jti to the CP's
    /api/revocation/entries. The researcher (the issuer, and the only agent
    that verifies this TCT) pulls its entries back from the CP, signs them
    into its own list at /.well-known/aitp-revocation-list (advertised in its
    Manifest), verifies that list against its own AID and applies it.

    Read the final probe carefully — it proves less than it looks like it
    does. `blocked_call` is writer -> researcher, and the researcher also
    revoked locally, so its 403 names `local` and would fire identically with
    the CP path broken. What the CP half demonstrates is that the entry makes
    the round trip into the issuer's signed, served list — visible as
    `issuer_revoked_count` and the `revocation.list_fetched` event.
    `revocation-cp-only` is the scenario where the CP entry alone decides.
  tags: [revocation, rfc-0008, control-plane, federation, intra-org]

spec:
  inputs:
    schema:
      type: object
      properties:
        topic:
          type: string
          default: "AI agent revocation"
      required: [topic]

  agents:
    - id: researcher
      ref: _shared/agents/researcher
      port_offset: 0
    - id: writer
      ref: _shared/agents/writer
      port_offset: 1

  trust:
    boundary: intra_org
    discovery: static
    eager: false

  workflow:
    steps:
      - id: handshake
        type: handshake
        initiator: writer
        responder: researcher
        description: Writer initiates handshake; researcher issues writer a TCT.

      - id: first_call
        agent: writer
        capability: research.query
        input_template: "{{ inputs.topic }}"
        description: First call succeeds — writer's TCT is valid.

      - id: revoke
        type: revoke_tct
        issuer: researcher
        audience: writer
        via_cp: true
        reason: "compromised-token"
        description: >
          Researcher revokes writer's TCT locally AND publishes the jti to
          the CP's /api/revocation/entries. The engine then asks the
          researcher to refresh: it re-pulls its entries, re-signs its own
          list and verifies it against its own AID before applying any
          entry. The CP signs nothing; an unverifiable list is discarded.

      - id: blocked_call
        type: capability_probe
        agent: writer
        target_agent: researcher
        capability: research.query
        expect_status: 403
        input_template: "{{ inputs.topic }}"
        description: >
          Writer retries with the same held TCT. Researcher's deny-set
          contains the jti; rejection happens before any signature check.
