apiVersion: aitp.dev/v1
kind: ScenarioVersion
metadata:
  pack: intra-org
  scenario: revocation-via-cp
  version: 1.0.0
  name: Revocation via Control Plane (RFC-AITP-0008)
  summary: >
    Revocation propagation through the Control Plane.
    Researcher establishes trust with writer; writer issues a TCT and the
    researcher's first call succeeds. Researcher then revokes the writer's
    TCT and the engine *also* posts the jti to the CP's
    /api/revocation/entries. The writer pulls the updated revocation list
    from /.well-known/aitp-revocation-list into its local deny-set.

    Read the final probe carefully — it proves less than it looks like it
    does. `blocked_call` is writer -> researcher, so its 403 comes from the
    *researcher's* local deny-set (set directly by /admin/revoke-tct), and it
    would fire identically with the whole CP path broken. The writer's
    CP-derived deny-set is never consulted on that call: /admin/invoke
    attaches the held TCT unconditionally, and a deny-set is only read by the
    peer serving a capability. So what the CP half demonstrates is that the
    revocation *data* reaches an unrelated peer — visible as
    `audience_revoked_count` and the `revocation.list_fetched` event — not
    that it changes an enforcement outcome anywhere in this run.

    The fetched snapshot IS signature-verified before any entry is applied
    (`aitp.verify_revocation_list` against the pinned CP_AID; an unverifiable
    snapshot is discarded, never merged). What this scenario still does not
    show is a step driving a call *into* the writer to make its refreshed
    deny-set decide something.
  tags: [revocation, rfc-0008, control-plane, federation, intra-org]

spec:
  inputs:
    schema:
      type: object
      properties:
        topic:
          type: string
          default: "AI agent revocation"
      required: [topic]

  agents:
    - id: researcher
      ref: _shared/agents/researcher
      port_offset: 0
    - id: writer
      ref: _shared/agents/writer
      port_offset: 1

  trust:
    boundary: intra_org
    discovery: static
    eager: false

  workflow:
    steps:
      - id: handshake
        type: handshake
        initiator: writer
        responder: researcher
        description: Writer initiates handshake; researcher issues writer a TCT.

      - id: first_call
        agent: writer
        capability: research.query
        input_template: "{{ inputs.topic }}"
        description: First call succeeds — writer's TCT is valid.

      - id: revoke
        type: revoke_tct
        issuer: researcher
        audience: writer
        via_cp: true
        reason: "compromised-token"
        description: >
          Researcher revokes writer's TCT locally AND publishes the jti to
          the CP's /api/revocation/entries. The engine then asks the
          writer (the audience) to refresh its view from
          /.well-known/aitp-revocation-list, so the writer fails-closed
          on this jti even though the issuer never called it back.

          The CP signs that snapshot and the writer verifies it against
          the AID pinned in CP_AID before applying any entry, so this is
          authenticated propagation. With no CP_AID pinned the snapshot is
          discarded rather than trusted — the fail-closed posture.

      - id: blocked_call
        type: capability_probe
        agent: writer
        target_agent: researcher
        capability: research.query
        expect_status: 403
        input_template: "{{ inputs.topic }}"
        description: >
          Writer retries with the same held TCT. Researcher's deny-set
          contains the jti; rejection happens before any signature check.
