services:
  playground:
    build:
      # Parent directory so the multi-stage build can see the sibling
      # aitp-rs/ source tree and build the SDK wheel from source.
      context: ..
      dockerfile: aitp-playground/Dockerfile
    image: aitp-playground:latest
    ports:
      - "8000:8000"
      - "8100-8120:8100-8120"
    environment:
      - PLAYGROUND_BASE_URL=http://localhost:8000
      - LOG_LEVEL=INFO
    env_file:
      - .env
