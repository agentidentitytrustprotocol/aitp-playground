services:
  playground:
    build:
      # Parent directory: the Dockerfile copies `aitp-playground/...` paths
      # relative to it (and AITP_SDK_SOURCE=path needs the sibling aitp-rs/).
      context: ..
      dockerfile: aitp-playground/Dockerfile
      args:
        # The published PyPI wheels lack the experimental features
        # (renewal, session bundles, multihop) from aitp-sdk 0.24; compile
        # the locked sdist with them, like the hosted image (D-26).
        AITP_SDK_SOURCE: pypi-src
        AITP_SDK_FEATURES: experimental
    image: aitp-playground:latest
    ports:
      - "8000:8000"
      - "8100-8120:8100-8120"
    environment:
      - PLAYGROUND_BASE_URL=http://localhost:8000
      - LOG_LEVEL=INFO
    env_file:
      - .env
